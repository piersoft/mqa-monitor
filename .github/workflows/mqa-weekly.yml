name: Monitoraggio MQA

on:
  schedule:
    # 06:00 UTC = 08:00 ora legale italiana (07:00 in ora solare)
    # EDP ricalcola quasi ogni giorno: la rilevazione SPARQL gira tutti i giorni,
    # lo scroll dell'API solo il lunedi (il .csv.gz e' gia compresso e non si
    # comprime in git: 1 MB al giorno gonfierebbe il repo).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      catalog:
        description: "ID catalogo su data.europa.eu"
        default: "dati-gov-it"
      group_by:
        description: "Livello di aggregazione"
        type: choice
        options: [organization, publisher]
        default: organization
      min_datasets:
        description: "Soglia minima di dataset per ente"
        default: "5"
      top:
        description: "Quanti enti mostrare per sezione"
        default: "25"
      forza_scroll:
        description: "Esegui anche lo scroll dell'API (di norma solo il lunedi)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mqa-monitor
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Che giorno e
        id: giorno
        run: echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Esegui snapshot e diff
        if: steps.giorno.outputs.dow == '1' || inputs.forza_scroll
        id: run
        env:
          CATALOG: ${{ inputs.catalog || 'dati-gov-it' }}
          GROUP_BY: ${{ inputs.group_by || 'organization' }}
          MIN_DATASETS: ${{ inputs.min_datasets || '5' }}
          TOP: ${{ inputs.top || '25' }}
        run: |
          python3 mqa_monitor.py \
            --catalog "$CATALOG" \
            --group-by "$GROUP_BY" \
            --outdir ./mqa \
            --min-datasets "$MIN_DATASETS" \
            --top "$TOP"
          DAY=$(date -u +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "report=mqa/report_${CATALOG}_${GROUP_BY}_${DAY}.md" >> "$GITHUB_OUTPUT"

      - name: Rilevazione per titolare (SPARQL)
        continue-on-error: true
        run: python3 mqa_sparql.py --catalog "${{ inputs.catalog || 'dati-gov-it' }}"

      - name: Ricostruisci storico e pagina pubblica
        run: python3 build_site.py --catalog "${{ inputs.catalog || 'dati-gov-it' }}"

      - name: Riepilogo nel job summary
        if: steps.run.outputs.report != ''
        run: cat "${{ steps.run.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit dello snapshot
        run: |
          git config user.name "mqa-bot"
          git config user.email "actions@github.com"
          git add mqa docs
          git diff --staged --quiet || git commit -m "MQA snapshot ${{ steps.run.outputs.day }}"
          git push

      - name: Apri issue con il report
        if: steps.run.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "MQA ${{ steps.run.outputs.day }} — chi sale e chi scende" \
            --body-file "${{ steps.run.outputs.report }}" \
            --label mqa || true
