name: Monitoraggio MQA

on:
  schedule:
    # EDP ricalcola quasi ogni giorno: la rilevazione SPARQL gira tutti i
    # giorni, lo scroll dell'API solo il lunedi (il .csv.gz e' gia compresso e
    # non si comprime in git: 1 MB al giorno gonfierebbe il repo).
    #
    # Due corse al giorno, a dodici ore di distanza: piu' corse ravvicinate
    # coprirebbero meno ore a parita' di carico su un servizio pubblico.
    # La seconda serve a recuperare le giornate in cui il
    # triplestore di data.europa.eu non risponde — succede: il 15 agosto ha
    # dato 504 per ore. Se la rilevazione del giorno c'e' gia', il passo SPARQL
    # viene saltato e la corsa pomeridiana non fa nulla.
    #
    # Minuti dispari perche' allo scoccare dell'ora la coda di GitHub e' piu'
    # affollata; l'orario reale slitta comunque di qualche decina di minuti.
    - cron: "17 6 * * *"     # 08:17 ora legale italiana, 07:17 in ora solare
    - cron: "17 18 * * *"    # 20:17 ora legale italiana, 19:17 in ora solare
  workflow_dispatch:
    inputs:
      catalog:
        description: "ID catalogo su data.europa.eu"
        default: "dati-gov-it"
      group_by:
        description: "Livello di aggregazione"
        type: choice
        options: [organization, publisher]
        default: organization
      min_datasets:
        description: "Soglia minima di dataset per ente"
        default: "5"
      top:
        description: "Quanti enti mostrare per sezione"
        default: "25"
      forza_scroll:
        description: "Esegui anche lo scroll dell'API (di norma solo il lunedi)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mqa-monitor
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Che giorno e
        id: giorno
        run: echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Esegui snapshot e diff
        if: steps.giorno.outputs.dow == '1' || inputs.forza_scroll
        id: run
        env:
          CATALOG: ${{ inputs.catalog || 'dati-gov-it' }}
          GROUP_BY: ${{ inputs.group_by || 'organization' }}
          MIN_DATASETS: ${{ inputs.min_datasets || '5' }}
          TOP: ${{ inputs.top || '25' }}
        run: |
          python3 mqa_monitor.py \
            --catalog "$CATALOG" \
            --group-by "$GROUP_BY" \
            --outdir ./mqa \
            --min-datasets "$MIN_DATASETS" \
            --top "$TOP"
          DAY=$(date -u +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "report=mqa/report_${CATALOG}_${GROUP_BY}_${DAY}.md" >> "$GITHUB_OUTPUT"

      # continue-on-error perche il lunedi lo scroll dell'API deve comunque
      # essere committato anche se il triplestore non risponde. Il controllo
      # esplicito piu sotto fa fallire il job se non e uscito nulla di nuovo.
      - name: Serve la rilevazione?
        id: serve
        env:
          CATALOG: ${{ inputs.catalog || 'dati-gov-it' }}
        run: |
          DAY=$(date -u +%F)
          if [ -f "mqa/titolari/${CATALOG}_${DAY}.csv" ]; then
            echo "la rilevazione del $DAY c'e' gia': salto la parte SPARQL"
            echo "serve=no" >> "$GITHUB_OUTPUT"
          else
            echo "nessuna rilevazione per il $DAY: procedo"
            echo "serve=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Rilevazione SPARQL (titolari e organizzazioni)
        if: steps.serve.outputs.serve == 'si'
        continue-on-error: true
        run: python3 mqa_sparql.py --catalog "${{ inputs.catalog || 'dati-gov-it' }}"

      - name: Ricostruisci storico e pagina pubblica
        run: python3 build_site.py --catalog "${{ inputs.catalog || 'dati-gov-it' }}"

      # le mappe leggono docs/data.json, quindi vanno dopo build_site.py;
      # se falliscono non devono fermare la rilevazione
      - name: Rigenera le mappe
        continue-on-error: true
        run: python3 build_maps.py

      - name: Riepilogo nel job summary
        if: steps.run.outputs.report != ''
        run: cat "${{ steps.run.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verifica che ci sia una rilevazione di oggi
        env:
          CATALOG: ${{ inputs.catalog || 'dati-gov-it' }}
        run: |
          DAY=$(date -u +%F)
          TROVATI=$(ls mqa/titolari/${CATALOG}_${DAY}.csv \
                       mqa/organizzazioni/${CATALOG}_${DAY}.csv \
                       mqa/dataset/${CATALOG}_${DAY}.csv.gz 2>/dev/null | wc -l)
          echo "rilevazioni con data $DAY: $TROVATI"
          if [ "$TROVATI" -eq 0 ]; then
            echo "::error::Nessuna rilevazione prodotta per $DAY. Controlla il log dello step SPARQL."
            exit 1
          fi

      - name: Commit dello snapshot
        run: |
          git config user.name "mqa-bot"
          git config user.email "actions@github.com"
          git add mqa docs
          git diff --staged --quiet || git commit -m "MQA snapshot ${{ steps.run.outputs.day }}"
          git push

      - name: Apri issue con il report
        if: steps.run.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "MQA ${{ steps.run.outputs.day }} — chi sale e chi scende" \
            --body-file "${{ steps.run.outputs.report }}" \
            --label mqa || true
